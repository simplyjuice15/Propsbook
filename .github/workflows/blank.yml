name: Refresh slate

on:
  schedule:
    - cron: "0 15 * * *"   # 11am Eastern: full rebuild of every sport
    - cron: "5 * * * *"    # hourly: only sports with games starting within about 4 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh-slate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            public/data
            propbook/public/data
            .cache
            propbook/.cache
          key: propbook-data-${{ github.run_id }}
          restore-keys: propbook-data-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build today's slate
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          ODDS_BOOKMAKERS: ${{ vars.ODDS_BOOKMAKERS }}
          ODDS_SPORTS: ${{ vars.ODDS_SPORTS }}
          ODDS_WINDOW_HOURS: ${{ vars.ODDS_WINDOW_HOURS }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          STRIPE_MONTHLY_LINK: ${{ vars.STRIPE_MONTHLY_LINK }}
          STRIPE_YEARLY_LINK: ${{ vars.STRIPE_YEARLY_LINK }}
          STRIPE_PORTAL_LINK: ${{ vars.STRIPE_PORTAL_LINK }}
          PREMIUM_MONTHLY_PRICE: ${{ vars.PREMIUM_MONTHLY_PRICE }}
          PREMIUM_YEARLY_PRICE: ${{ vars.PREMIUM_YEARLY_PRICE }}
        run: |
          if [ -f propbook.zip ]; then unzip -oq propbook.zip; fi
          if [ -d propbook/scripts ]; then cd propbook; fi
          npm test
          if [ "$GITHUB_EVENT_SCHEDULE" = "5 * * * *" ]; then
            node scripts/refresh.mjs --due
          else
            node scripts/refresh.mjs
          fi
          cp -r public "$GITHUB_WORKSPACE/site"
          echo thepropbook.com > "$GITHUB_WORKSPACE/site/CNAME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
